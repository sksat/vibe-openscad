# ---------------------------------------------------------------------------
# OpenAI
# 価格は **未検証の推定値 + リーダーボードからの逆算**(公式ページの web fetch が
# ブロックされたため)。実勢と数倍違う可能性があるので、cost_usd を比較指標として
# 使う前に https://openai.com/api/pricing で実値を確認・更新すること。
#
# thinking は指定しない: OpenAI は thinking を effort に内包していて、独立した
# thinking 軸を持たない。
# ---------------------------------------------------------------------------

# GPT-6 Astra(2026-09-03)。id が gpt-<世代>-<コードネーム> で web 側の
# パターンから外れるため label を宣言する(sort は ^gpt-6 が拾える)。
# effort は low / medium / high / xhigh / max。既定は明記されていないが
# gpt-5 系と同じ medium として扱う。
gpt-6-astra:
  provider: openai
  rate: { in: 10, out: 50 }
  vision: true
  effort: medium
  label: gpt 6 astra

# GPT-5.6。数字が世代、Sol / Terra / Luna がティア(Sol が最上位)という
# 新しい命名で、web 側のパターン(gpt-<数字>-<mini|nano|pro>)から外れるため
# label と sort を宣言する。sort.version は既存の派生値と同じ major*1000+minor、
# sort.size はティア順(sol=0 / terra=1 / luna=2)。
# effort は low / medium(既定) / high / xhigh / max。
gpt-5.6-luna:
  provider: openai
  rate: { in: 0.2, out: 1.2 }
  vision: true
  effort: medium
  label: gpt 5.6 luna
  sort: { family: 0, version: 5006, size: 2 }
# GPT-5.6 Terra(3 ティアの中位)。命名が gpt-<世代>-<ティア> で web 側の
# パターンから外れるため label / sort を宣言する。sort.size はティア順。
gpt-5.6-terra:
  provider: openai
  rate: { in: 2, out: 12 }
  vision: true
  effort: medium
  label: gpt 5.6 terra
  sort: { family: 0, version: 5006, size: 1 }

# GPT-5.6 Sol(3 ティアの最上位)。sort.size=0 で terra / luna より前に並ぶ。
gpt-5.6-sol:
  provider: openai
  rate: { in: 5, out: 30 }
  vision: true
  effort: medium
  label: gpt 5.6 sol
  sort: { family: 0, version: 5006, size: 0 }

# gpt-5 系はすべて vision 対応・reasoning effort の既定 medium。個別世代の
# エントリは rate だけ上書きする。
gpt-5:
  provider: openai
  rate: { in: 1.25, out: 10 }
  vision: true
  effort: medium
  # 2026-12-11 に提供終了予定(Models API の shutdown_date)。
  shutdownAt: "2026-12-11"

gpt-5-pro:
  provider: openai
  rate: { in: 15, out: 120 }

gpt-5-mini:
