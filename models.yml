# vision は true: Claude 3 系は画像入力に対応している。移行元の正規表現
# `^claude-(fable|opus|sonnet|haiku)-\d` は `claude-3-haiku`(族名の前に
# 世代が来る旧命名)にマッチせず false を返していたが、それはバグ。
