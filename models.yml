  vision: true
  effort: null # Haiku 4.5 は output_config.effort を受け付けない
  thinking: "off" # `thinking` 省略時は思考しない(budget_tokens 明示でのみ on)

# --- legacy(まだ API で叩ける世代)---

# effort は Opus 4.5 から(high が最高)。thinking は明示 opt-in なので既定 off。
