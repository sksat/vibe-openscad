# モデルカタログ — モデル固有の事実を集約した単一情報源。
#
# ここに置くのは「モデルを見れば決まる事実」だけ:
#   - rate         $/Mtok(in / out)。省略 = 価格不明(セルフホスト等)
#   - vision       画像入力を受け付けるか
#   - effort       provider 既定の reasoning effort。null = effort ノブ無し
#   - thinking     provider 既定の thinking モード。null = thinking 軸無し
#   - label / sort UI 表示名・並び順。**命名規則から外れるモデルだけ** 書く
#                  (`claude-opus-5` や `gemini-3.8-flash` のような素直な id は
#                   web 側のパターンマッチで自動導出されるので不要)。書いた
#                   場合はパターン推論より優先される
#
# 「どの組み合わせを実行するか」は bench-config.yml の matrix 側の仕事。
# ここには実行条件(temperature、max_tokens 等)を書かない。
#
# キーは **モデル id の prefix**。フィールド単位で「最長一致が勝つ」形で
# 継承されるので、dated snapshot は alias のエントリを自動で引き継ぐ:
#   claude-haiku-4-5-20251001 → `claude-haiku-4-5`
#   gpt-5.4-2026-03-05        → `gpt-5.4` → `gpt-5`(未定義フィールドのみ)
#
# モデルを追加するときは、ここに 1 エントリ足して bench-config.yml の matrix に
# 行を足すだけでよい(テストは models.test.ts / dataset.test.ts の網羅テストが
# 自動でカバーする)。詳細は DESIGN.md「モデルカタログ」節。

# ---------------------------------------------------------------------------
# Anthropic
# 出典: Anthropic 公式ドキュメント(価格は 2026-09 時点)
# ---------------------------------------------------------------------------

# Fable 5.1 は Fable 5 の後継で同ティア・同単価。thinking の制約も同じ
# (常時 on、明示 disable は 400)。tool_choice の any / tool が 400 になる等の
# 差はあるが、本ベンチは tool を使わないので影響しない。
claude-fable-5-1:
  provider: anthropic
  rate: { in: 10, out: 50 }
  vision: true
  effort: high
  thinking: adaptive

# Fable は Opus の上の新ティア。adaptive thinking が常時 on で、明示の
# `{type: disabled}` は API が 400 を返す(= thinking off が存在しない)。
claude-fable-5:
  provider: anthropic
  retirementNotBefore: "2027-06-09"
  rate: { in: 10, out: 50 }
  vision: true
  effort: high
  thinking: adaptive

# Opus 5 は thinking が **既定で on**(`thinking` 省略でも adaptive が走る)。
# 4.8 / 4.7 は省略 = 思考しない、だったので既定値が反転している。
claude-opus-5:
  provider: anthropic
  retirementNotBefore: "2027-07-24"
  rate: { in: 5, out: 25 }
  vision: true
  effort: high
  thinking: adaptive

claude-opus-4-8:
  provider: anthropic
  retirementNotBefore: "2027-05-28"
  rate: { in: 5, out: 25 }
  vision: true
  effort: high
  thinking: adaptive

claude-opus-4-7:
