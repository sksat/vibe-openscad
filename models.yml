  rate: { in: 5, out: 25 }
  vision: true
  effort: high
  thinking: adaptive

# Sonnet 5 は Sonnet 4.6($3/$15)から値下げ。thinking は adaptive のみが
# on モード(`thinking` 省略でも adaptive)、明示 disable は受け付ける。
