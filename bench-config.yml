    model: claude-opus-4-7
  - id: iter-png-2/claude-opus-4-7
    harness: { kind: bare, iterateFrom: iter-png-1/claude-opus-4-7, iteration: { kind: render-png-feedback } }
    provider: anthropic
    model: claude-opus-4-7
  - id: iter-png-3/claude-opus-4-7
    harness: { kind: bare, iterateFrom: iter-png-2/claude-opus-4-7, iteration: { kind: render-png-feedback } }
    provider: anthropic
    model: claude-opus-4-7

  - id: iter-png-1/claude-haiku-4-5
