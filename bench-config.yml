  - id: bare-low/gpt-5
    harness: { kind: bare }
    provider: openai
    model: gpt-5-2025-08-07
    modelOptions: { reasoning: { effort: low } }
  - id: bare-high/gpt-5
    harness: { kind: bare }
    provider: openai
    model: gpt-5-2025-08-07
    modelOptions: { reasoning: { effort: high } }
  - id: bare/gpt-5-mini
    harness: { kind: bare }
