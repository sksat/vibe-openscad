  # --- iteration chain (PNG feedback) ---
  # 各 iteration step は独立した benchmark run。iter-png-1 は bare の出力を
  # 見せて修正させ、iter-png-2 は iter-png-1 の出力を見せて、… と数珠繋ぎ。
  # 別の戦略 (error-text-feedback など) を同じ bare から分岐させたいときも
  # iterateFrom を bare に向ければ iter-png-1 を再実行せずに枝分かれできる。
  #
  # 全部走らせると Claude 7 モデル × 3 step × 3 task = 63 call で結構嵩む
  # (opus 系 1 step ~ $0.02-0.05)。`--filter iter-png:sonnet-4-6` などで絞ると
