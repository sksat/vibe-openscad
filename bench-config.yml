defaults:
  samples: 1
  timeoutSec: 300

# 可能なら dated snapshot を使う。Anthropic がエイリアスを内部的に
# 別スナップショットへ向け直しても、エイリアス文字列は変わらず
# fingerprint で検出できないため、dated を書けるなら必ず書く。
# (Opus 4.7 / Sonnet 4.6 は dated suffix が未公開なので alias のまま)
matrix:
  # --- 現行世代 ---
  - id: bare/claude-opus-4-7
    harness: { kind: bare }
    provider: anthropic
    model: claude-opus-4-7
  # Effort variants of opus 4.7 — default `bare/...` is effort=high.
  # max は Opus 系のみ。xhigh は Opus 4.7 のみ。
  - id: bare-low/claude-opus-4-7
    harness: { kind: bare }
    provider: anthropic
    model: claude-opus-4-7
    modelOptions: { output_config: { effort: low } }
  - id: bare-max/claude-opus-4-7
    harness: { kind: bare }
    provider: anthropic
    model: claude-opus-4-7
    modelOptions: { output_config: { effort: max } }
  - id: bare-xhigh/claude-opus-4-7
    harness: { kind: bare }
    provider: anthropic
    model: claude-opus-4-7
    modelOptions: { output_config: { effort: xhigh } }
  # Thinking variant — adaptive thinking is the Opus 4.7 default;
  # explicitly disable it to compare \"thinking off\" baseline.
  - id: bare-think-off/claude-opus-4-7
    harness: { kind: bare }
    provider: anthropic
    model: claude-opus-4-7
    modelOptions: { thinking: { type: disabled } }
  - id: bare/claude-sonnet-4-6
    harness: { kind: bare }
    provider: anthropic
    model: claude-sonnet-4-6
  - id: bare-low/claude-sonnet-4-6
    harness: { kind: bare }
    provider: anthropic
    model: claude-sonnet-4-6
    modelOptions: { output_config: { effort: low } }
  - id: bare-think-off/claude-sonnet-4-6
    harness: { kind: bare }
    provider: anthropic
    model: claude-sonnet-4-6
    modelOptions: { thinking: { type: disabled } }
  - id: bare/claude-haiku-4-5
    harness: { kind: bare }
    provider: anthropic
    model: claude-haiku-4-5-20251001

  # --- 旧世代(比較用。--filter で絞らないと API コストが嵩むので注意) ---
  - id: bare/claude-opus-4-5
    harness: { kind: bare }
    provider: anthropic
    model: claude-opus-4-5-20251101
  - id: bare-low/claude-opus-4-5
    harness: { kind: bare }
    provider: anthropic
    model: claude-opus-4-5-20251101
    modelOptions: { output_config: { effort: low } }
  # NOTE: max effort は Opus 4.6 以降のみ (4.5 は high が最高)。xhigh は
  # さらに 4.7 のみ。bare-max / bare-xhigh は Opus 4.5 では API が拒絶する。
  - id: bare/claude-opus-4-1
    harness: { kind: bare }
    provider: anthropic
    model: claude-opus-4-1-20250805
  - id: bare/claude-opus-4-0
    harness: { kind: bare }
    provider: anthropic
    model: claude-opus-4-20250514
  - id: bare/claude-sonnet-4-5
    harness: { kind: bare }
    provider: anthropic
    model: claude-sonnet-4-5-20250929
  - id: bare/claude-sonnet-4-0
    harness: { kind: bare }
    provider: anthropic
    model: claude-sonnet-4-20250514

  # --- Google Gemini ---
  # Gemini は alias 指定が一般的(2.5 系は dated suffix 非公開)。
  # Gemini 3 は 2026-04 時点では preview のみ。
  - id: bare/gemini-3.1-pro
    harness: { kind: bare }
    provider: google
    model: gemini-3.1-pro-preview
  # NOTE: Gemini Pro 系 (2.5-pro / 3.1-pro) は API が thinkingBudget: 0
  # を弾く ("This model only works in thinking mode")。Flash 系のみ
  # bare-think-off variant を持てる。
  - id: bare/gemini-3-flash
    harness: { kind: bare }
    provider: google
    model: gemini-3-flash-preview
  - id: bare-think-off/gemini-3-flash
    harness: { kind: bare }
    provider: google
    model: gemini-3-flash-preview
    modelOptions:
      config: { thinkingConfig: { thinkingBudget: 0 } }
  - id: bare/gemini-3.1-flash-lite
    harness: { kind: bare }
    provider: google
    model: gemini-3.1-flash-lite-preview
  - id: bare-think-off/gemini-3.1-flash-lite
    harness: { kind: bare }
    provider: google
    model: gemini-3.1-flash-lite-preview
    modelOptions:
      config: { thinkingConfig: { thinkingBudget: 0 } }
  - id: bare/gemini-2.5-pro
    harness: { kind: bare }
    provider: google
    model: gemini-2.5-pro
  - id: bare/gemini-2.5-flash
    harness: { kind: bare }
    provider: google
    model: gemini-2.5-flash
  - id: bare-think-off/gemini-2.5-flash
    harness: { kind: bare }
    provider: google
    model: gemini-2.5-flash
    modelOptions:
      config: { thinkingConfig: { thinkingBudget: 0 } }
  - id: bare/gemini-2.5-flash-lite
    harness: { kind: bare }
    provider: google
    model: gemini-2.5-flash-lite
  - id: bare-think-off/gemini-2.5-flash-lite
    harness: { kind: bare }
    provider: google
    model: gemini-2.5-flash-lite
    modelOptions:
      config: { thinkingConfig: { thinkingBudget: 0 } }

  # --- OpenAI ---
  # `pnpm --filter runners run list-openai-models` で確認した、API key で
  # 実際に見えるモデル。ただし "*-pro" 系は組織認証(verified org)が必要で
  # 一般 tier だと 404 になるので、認証完了したらコメント解除してください。
  # 429 "exceeded quota" が出る場合は billing/支払い方法側の問題。
  # - id: bare/gpt-5.2-pro
  #   harness: { kind: bare }
  #   provider: openai
  #   model: gpt-5.2-pro-2025-12-11
  # - id: bare/gpt-5-pro
  #   harness: { kind: bare }
  #   provider: openai
  #   model: gpt-5-pro-2025-10-06
