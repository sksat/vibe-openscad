  - id: iter-png-3/claude-sonnet-4-5
    harness: { kind: bare, iterateFrom: iter-png-2/claude-sonnet-4-5, iteration: { kind: render-png-feedback } }
    provider: anthropic
    model: claude-sonnet-4-5-20250929

  - id: iter-png-1/claude-sonnet-4-0
    harness: { kind: bare, iterateFrom: bare/claude-sonnet-4-0, iteration: { kind: render-png-feedback } }
    provider: anthropic
    model: claude-sonnet-4-20250514
  - id: iter-png-2/claude-sonnet-4-0
    harness: { kind: bare, iterateFrom: iter-png-1/claude-sonnet-4-0, iteration: { kind: render-png-feedback } }
