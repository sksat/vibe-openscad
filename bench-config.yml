  - id: pdf-page/gemini-3-flash
    harness: { kind: pdf-page }
    provider: google
    model: gemini-3-flash-preview

  # --- セルフホスト OpenAI 互換 endpoint (LM Studio / Ollama / vLLM 等) ---
  # OPENAI_SELF_HOSTED_BASE_URL=.../v1 で接続先指定。VRAM 制約で並走できない
  # ので `defaults.concurrency.perProvider.openai-self-hosted: 1` を推奨。
  # 試運転として 1 モデル。動いたら他のローカルモデルを順次足す。
  - id: bare/gpt-oss-20b
    harness: { kind: bare }
    provider: openai-self-hosted
    model: openai/gpt-oss-20b
  - id: bare/gemma-3-27b
    harness: { kind: bare }
    provider: openai-self-hosted
    model: google/gemma-3-27b
  - id: bare/nemotron-3-nano-4b
    harness: { kind: bare }
    provider: openai-self-hosted
    model: nvidia/nemotron-3-nano-4b

  # --- iteration chain (PNG feedback) ---
  # 各 iteration step は独立した benchmark run。iter-png-1 は bare の出力を
  # 見せて修正させ、iter-png-2 は iter-png-1 の出力を見せて、… と数珠繋ぎ。
  # 別の戦略 (error-text-feedback など) を同じ bare から分岐させたいときも
  # iterateFrom を bare に向ければ iter-png-1 を再実行せずに枝分かれできる。
  #
  # 全部走らせると Claude 7 モデル × 3 step × 3 task = 63 call で結構嵩む
  # (opus 系 1 step ~ $0.02-0.05)。`--filter iter-png:sonnet-4-6` などで絞ると
  # よい。
  - id: iter-png-1/claude-sonnet-4-6
    harness: { kind: bare, iterateFrom: bare/claude-sonnet-4-6, iteration: { kind: render-png-feedback } }
    provider: anthropic
    model: claude-sonnet-4-6
  - id: iter-png-2/claude-sonnet-4-6
    harness: { kind: bare, iterateFrom: iter-png-1/claude-sonnet-4-6, iteration: { kind: render-png-feedback } }
    provider: anthropic
    model: claude-sonnet-4-6
  - id: iter-png-3/claude-sonnet-4-6
    harness: { kind: bare, iterateFrom: iter-png-2/claude-sonnet-4-6, iteration: { kind: render-png-feedback } }
    provider: anthropic
    model: claude-sonnet-4-6

  - id: iter-png-1/claude-opus-4-7
