defaults:
  samples: 1
  timeoutSec: 300

# 可能なら dated snapshot を使う。Anthropic がエイリアスを内部的に
# 別スナップショットへ向け直しても、エイリアス文字列は変わらず
# fingerprint で検出できないため、dated を書けるなら必ず書く。
# (Fable 5 / Opus 4.8 / 4.7 / Sonnet 4.6 は dated suffix が未公開なので alias のまま)
matrix:
  # --- 現行世代 ---
  # Fable 5 — Opus の上の新ティア($10/$50 per Mtok)。API surface は
  # Opus 4.7/4.8 と同系(temperature 等の sampling params 不可、effort は
  # low/medium/high/xhigh/max)だが、adaptive thinking が **常時 on**
  # (thinking 省略でも適用、明示の {type: disabled} は API がエラー)。
  # thinking off は存在しないため bare-think-off variant は持てない。
  # thinking 出力は display=omitted がデフォルト(blocks は返るが中身空)で、
  # thinking トークンも max_tokens を消費する。このため runner デフォルトの
  # max_tokens=4096 では重いタスクで SCAD が出る前に切れる(tier-3 全滅)。
  # 公式ドキュメントの標準例に合わせ 16000 を modelOptions で明示する
  # (fingerprint に乗るので条件変更として検出される)。
  # https://platform.claude.com/docs/en/build-with-claude/adaptive-thinking
  - id: bare/claude-fable-5
    harness: { kind: bare }
    provider: anthropic
    model: claude-fable-5
    modelOptions: { max_tokens: 16000 }
  - id: bare-low/claude-fable-5
    harness: { kind: bare }
    provider: anthropic
    model: claude-fable-5
    modelOptions: { output_config: { effort: low }, max_tokens: 16000 }
  - id: bare-max/claude-fable-5
    harness: { kind: bare }
    provider: anthropic
    model: claude-fable-5
    modelOptions: { output_config: { effort: max }, max_tokens: 16000 }
  - id: bare-xhigh/claude-fable-5
    harness: { kind: bare }
    provider: anthropic
    model: claude-fable-5
    modelOptions: { output_config: { effort: xhigh }, max_tokens: 16000 }
  # Opus 5 — thinking が既定で on(4.8/4.7 は `thinking` 省略 = 思考しない
  # だったので既定が反転している)。thinking トークンは max_tokens を消費する
  # ため、runner デフォルトの 4096 では重いタスクで SCAD が出る前に切れる
  # (Fable 5 で実際に tier-3 が全滅した)。Fable 5 と同じく 16000 を明示する。
  # max_tokens はモデルから見えない打ち切り上限なので生成分布には影響しない。
  #
  # 明示 disable (`{type: disabled}`) は effort high 以下でのみ受け付ける
  # (xhigh / max と併用すると 400)。既定 effort は high なので
  # bare-think-off は成立する。
  - id: bare/claude-opus-5
    harness: { kind: bare }
    provider: anthropic
    model: claude-opus-5
    modelOptions: { max_tokens: 16000 }
  - id: bare-low/claude-opus-5
    harness: { kind: bare }
    provider: anthropic
    model: claude-opus-5
    modelOptions: { output_config: { effort: low }, max_tokens: 16000 }
  - id: bare-xhigh/claude-opus-5
    harness: { kind: bare }
    provider: anthropic
    model: claude-opus-5
    modelOptions: { output_config: { effort: xhigh }, max_tokens: 16000 }
  - id: bare-max/claude-opus-5
    harness: { kind: bare }
    provider: anthropic
    model: claude-opus-5
    modelOptions: { output_config: { effort: max }, max_tokens: 16000 }
  - id: bare-think-off/claude-opus-5
    harness: { kind: bare }
    provider: anthropic
    model: claude-opus-5
    modelOptions: { thinking: { type: disabled }, max_tokens: 16000 }
  # Opus 4.8 — 4.7 と同じ API surface(breaking change なし)。
  - id: bare/claude-opus-4-8
    harness: { kind: bare }
    provider: anthropic
    model: claude-opus-4-8
  - id: bare-low/claude-opus-4-8
    harness: { kind: bare }
    provider: anthropic
    model: claude-opus-4-8
    modelOptions: { output_config: { effort: low } }
  - id: bare-max/claude-opus-4-8
    harness: { kind: bare }
    provider: anthropic
    model: claude-opus-4-8
    modelOptions: { output_config: { effort: max } }
  - id: bare-xhigh/claude-opus-4-8
    harness: { kind: bare }
    provider: anthropic
    model: claude-opus-4-8
    modelOptions: { output_config: { effort: xhigh } }
  - id: bare-think-off/claude-opus-4-8
    harness: { kind: bare }
    provider: anthropic
    model: claude-opus-4-8
    modelOptions: { thinking: { type: disabled } }
  - id: bare/claude-opus-4-7
    harness: { kind: bare }
    provider: anthropic
    model: claude-opus-4-7
  # Effort variants of opus 4.7 — default `bare/...` is effort=high.
  # max は Opus 系のみ。xhigh は Fable 5 / Opus 4.7+。
  - id: bare-low/claude-opus-4-7
    harness: { kind: bare }
    provider: anthropic
    model: claude-opus-4-7
    modelOptions: { output_config: { effort: low } }
  - id: bare-max/claude-opus-4-7
    harness: { kind: bare }
    provider: anthropic
    model: claude-opus-4-7
    modelOptions: { output_config: { effort: max } }
  - id: bare-xhigh/claude-opus-4-7
    harness: { kind: bare }
    provider: anthropic
    model: claude-opus-4-7
    modelOptions: { output_config: { effort: xhigh } }
  # Thinking variant — adaptive thinking is the Opus 4.7 default;
  # explicitly disable it to compare \"thinking off\" baseline.
  - id: bare-think-off/claude-opus-4-7
    harness: { kind: bare }
    provider: anthropic
    model: claude-opus-4-7
    modelOptions: { thinking: { type: disabled } }
  # Sonnet 5 — thinking が既定 on。thinking が on だと出力トークンが増えるので、
  # max_tokens が足りないと SCAD を出し切る前に打ち切られる(16000 で試すと
  # 35 run 中 8 件が out=16000 ちょうどで停止した)。公式推奨の 64000 を使う。
  # この値は SDK の非ストリーミング上限 21333 を超えるのでストリーミング経路
  # を通る(#11)。
  - id: bare/claude-sonnet-5
    harness: { kind: bare }
    provider: anthropic
    model: claude-sonnet-5
    modelOptions: { max_tokens: 64000 }
  - id: bare-low/claude-sonnet-5
    harness: { kind: bare }
    provider: anthropic
    model: claude-sonnet-5
    modelOptions: { output_config: { effort: low }, max_tokens: 64000 }
  - id: bare-xhigh/claude-sonnet-5
    harness: { kind: bare }
    provider: anthropic
    model: claude-sonnet-5
    modelOptions: { output_config: { effort: xhigh }, max_tokens: 64000 }
  - id: bare-max/claude-sonnet-5
    harness: { kind: bare }
    provider: anthropic
    model: claude-sonnet-5
    modelOptions: { output_config: { effort: max }, max_tokens: 64000 }
  - id: bare-think-off/claude-sonnet-5
    harness: { kind: bare }
    provider: anthropic
    model: claude-sonnet-5
    modelOptions: { thinking: { type: disabled }, max_tokens: 64000 }
  - id: bare/claude-sonnet-4-6
    harness: { kind: bare }
    provider: anthropic
    model: claude-sonnet-4-6
  - id: bare-low/claude-sonnet-4-6
    harness: { kind: bare }
    provider: anthropic
    model: claude-sonnet-4-6
    modelOptions: { output_config: { effort: low } }
  - id: bare-think-off/claude-sonnet-4-6
    harness: { kind: bare }
    provider: anthropic
    model: claude-sonnet-4-6
    modelOptions: { thinking: { type: disabled } }
  - id: bare/claude-haiku-4-5
    harness: { kind: bare }
    provider: anthropic
    model: claude-haiku-4-5-20251001

  # --- 旧世代(比較用。--filter で絞らないと API コストが嵩むので注意) ---
  - id: bare/claude-opus-4-5
    harness: { kind: bare }
    provider: anthropic
    model: claude-opus-4-5-20251101
  - id: bare-low/claude-opus-4-5
    harness: { kind: bare }
    provider: anthropic
    model: claude-opus-4-5-20251101
    modelOptions: { output_config: { effort: low } }
  # NOTE: max effort は Opus 4.6 以降のみ (4.5 は high が最高)。xhigh は
  # さらに 4.7 のみ。bare-max / bare-xhigh は Opus 4.5 では API が拒絶する。
  - id: bare/claude-opus-4-1
    harness: { kind: bare }
    provider: anthropic
    model: claude-opus-4-1-20250805
  - id: bare/claude-opus-4-0
    harness: { kind: bare }
    provider: anthropic
    model: claude-opus-4-20250514
  - id: bare/claude-sonnet-4-5
    harness: { kind: bare }
    provider: anthropic
    model: claude-sonnet-4-5-20250929
  - id: bare/claude-sonnet-4-0
    harness: { kind: bare }
    provider: anthropic
    model: claude-sonnet-4-20250514

  # --- Google Gemini ---
  # Gemini は alias 指定が一般的(2.5 系は dated suffix 非公開)。
  # Gemini 3 は 2026-04 時点では preview のみ。
  # Gemini 3.5 は 2026-05-19 (I/O) で flash が GA。3.5 系は thinkingBudget が
  # deprecated になっており、代わりに thinkingConfig.thinkingLevel
  # ('minimal' | 'low' | 'medium' | 'high', default medium) を使う。
  - id: bare/gemini-3.8-flash
    harness: { kind: bare }
    provider: google
    model: gemini-3.8-flash
  # 3.8 は thinkingLevel の 'minimal' が廃止され(指定すると 400)、'low' が
  # 下限。実タスクでは low / medium / high のうち low が thinking token 0 に
  # なるので、think-off variant は low を使う。
  - id: bare-think-off/gemini-3.8-flash
    harness: { kind: bare }
    provider: google
    model: gemini-3.8-flash
    modelOptions:
      config: { thinkingConfig: { thinkingLevel: low } }
  # 3.7 は 3.8 と同じく thinkingLevel の 'minimal' が廃止されていて 400 になる。
  # 下限は 'low' で、実タスクでは既定 402 token に対して low は 0 token。
  - id: bare/gemini-3.7-flash
    harness: { kind: bare }
    provider: google
    model: gemini-3.7-flash
  - id: bare-think-off/gemini-3.7-flash
    harness: { kind: bare }
    provider: google
    model: gemini-3.7-flash
    modelOptions:
      config: { thinkingConfig: { thinkingLevel: low } }
  # 3.6 は 3.7 / 3.8 と違い thinkingLevel の 'minimal' が使える。実タスクでは
  # 既定 1373 token / minimal 0 token / low 696 token で、'low' は思考する側
  # なので think-off には 'minimal' を使う。
  - id: bare/gemini-3.6-flash
    harness: { kind: bare }
    provider: google
    model: gemini-3.6-flash
  - id: bare-think-off/gemini-3.6-flash
    harness: { kind: bare }
    provider: google
    model: gemini-3.6-flash
    modelOptions:
      config: { thinkingConfig: { thinkingLevel: minimal } }
  - id: bare/gemini-3.5-flash
    harness: { kind: bare }
    provider: google
    model: gemini-3.5-flash
  - id: bare-think-off/gemini-3.5-flash
    harness: { kind: bare }
    provider: google
    model: gemini-3.5-flash
    modelOptions:
      config: { thinkingConfig: { thinkingLevel: minimal } }
  # 3.5 Flash-Lite。実タスクでは既定でも thinking 0 token で、minimal / low を
  # 指定しても 0 のまま。think-off は minimal(3.5 系の正系)で張る。
  - id: bare/gemini-3.5-flash-lite
    harness: { kind: bare }
    provider: google
    model: gemini-3.5-flash-lite
  - id: bare-think-off/gemini-3.5-flash-lite
    harness: { kind: bare }
    provider: google
    model: gemini-3.5-flash-lite
    modelOptions:
      config: { thinkingConfig: { thinkingLevel: minimal } }
  - id: bare/gemini-3.1-pro
    harness: { kind: bare }
    provider: google
    model: gemini-3.1-pro-preview
  # NOTE: Gemini Pro 系 (2.5-pro / 3.1-pro) は API が thinkingBudget: 0
  # を弾く ("This model only works in thinking mode")。Flash 系のみ
  # bare-think-off variant を持てる。
  - id: bare/gemini-3-flash
    harness: { kind: bare }
    provider: google
    model: gemini-3-flash-preview
  - id: bare-think-off/gemini-3-flash
    harness: { kind: bare }
    provider: google
    model: gemini-3-flash-preview
    modelOptions:
      config: { thinkingConfig: { thinkingBudget: 0 } }
  - id: bare/gemini-3.1-flash-lite
    harness: { kind: bare }
    provider: google
    model: gemini-3.1-flash-lite
  - id: bare-think-off/gemini-3.1-flash-lite
    harness: { kind: bare }
    provider: google
    model: gemini-3.1-flash-lite
    modelOptions:
      config: { thinkingConfig: { thinkingBudget: 0 } }
  - id: bare/gemini-2.5-pro
    harness: { kind: bare }
    provider: google
    model: gemini-2.5-pro
  - id: bare/gemini-2.5-flash
    harness: { kind: bare }
    provider: google
    model: gemini-2.5-flash
  - id: bare-think-off/gemini-2.5-flash
    harness: { kind: bare }
    provider: google
    model: gemini-2.5-flash
    modelOptions:
      config: { thinkingConfig: { thinkingBudget: 0 } }
  - id: bare/gemini-2.5-flash-lite
    harness: { kind: bare }
    provider: google
    model: gemini-2.5-flash-lite
  - id: bare-think-off/gemini-2.5-flash-lite
    harness: { kind: bare }
    provider: google
    model: gemini-2.5-flash-lite
    modelOptions:
      config: { thinkingConfig: { thinkingBudget: 0 } }

  # --- OpenAI ---
  # `pnpm --filter runners run list-openai-models` で確認した、API key で
  # 実際に見えるモデル。ただし "*-pro" 系は組織認証(verified org)が必要で
  # 一般 tier だと 404 になるので、認証完了したらコメント解除してください。
  # 429 "exceeded quota" が出る場合は billing/支払い方法側の問題。
  # - id: bare/gpt-5.2-pro
  #   harness: { kind: bare }
  #   provider: openai
  #   model: gpt-5.2-pro-2025-12-11
  # - id: bare/gpt-5-pro
