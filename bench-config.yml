    provider: anthropic
    model: claude-opus-4-5-20251101

  - id: iter-png-1/claude-opus-4-1
    harness: { kind: bare, iterateFrom: bare/claude-opus-4-1, iteration: { kind: render-png-feedback } }
    provider: anthropic
    model: claude-opus-4-1-20250805
  - id: iter-png-2/claude-opus-4-1
    harness: { kind: bare, iterateFrom: iter-png-1/claude-opus-4-1, iteration: { kind: render-png-feedback } }
    provider: anthropic
    model: claude-opus-4-1-20250805
  - id: iter-png-3/claude-opus-4-1
    harness: { kind: bare, iterateFrom: iter-png-2/claude-opus-4-1, iteration: { kind: render-png-feedback } }
