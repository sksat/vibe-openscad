    harness: { kind: bare }
    provider: openai
    model: gpt-5.4-2026-03-05
  # Effort variants of gpt-5.4 — default は medium。
  - id: bare-low/gpt-5.4
    harness: { kind: bare }
    provider: openai
    model: gpt-5.4-2026-03-05
    modelOptions: { reasoning: { effort: low } }
  - id: bare-high/gpt-5.4
