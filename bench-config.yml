    modelOptions: { reasoning: { effort: high } }

  # --- GPT-5 codex 系 (コーディング特化、reasoning + vision) ---
  # 古い世代から順に並べる。dated suffix が付かないので alias で書く。
  - id: bare/gpt-5-codex
    harness: { kind: bare }
    provider: openai
    model: gpt-5-codex
  - id: bare/gpt-5.1-codex
    harness: { kind: bare }
    provider: openai
    model: gpt-5.1-codex
  - id: bare/gpt-5.1-codex-mini
    harness: { kind: bare }
