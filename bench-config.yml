    model: gpt-5.4-mini-2026-03-17
  - id: bare/gpt-5.4-nano
    harness: { kind: bare }
    provider: openai
    model: gpt-5.4-nano-2026-03-17
  - id: bare/gpt-5
    harness: { kind: bare }
    provider: openai
    model: gpt-5-2025-08-07
  - id: bare/gpt-5-mini
    harness: { kind: bare }
    provider: openai
    model: gpt-5-mini-2025-08-07
  - id: bare/gpt-5-nano
