    model: gpt-5.2-codex
  - id: bare/gpt-5.3-codex
    harness: { kind: bare }
    provider: openai
    model: gpt-5.3-codex

  # --- pdf-page (tier-4 vision tasks: PDF page → image → bare-style call) ---
  # bare の単発と同形だが、task 側 `pdf_source` を pdftoppm で PNG に切り出して
  # provider に投げる前段が入る。vision capable な現行世代モデルだけ並べる。
  - id: pdf-page/claude-opus-4-7
    harness: { kind: pdf-page }
    provider: anthropic
    model: claude-opus-4-7
  - id: pdf-page/claude-sonnet-4-6
    harness: { kind: pdf-page }
    provider: anthropic
    model: claude-sonnet-4-6
  - id: pdf-page/claude-haiku-4-5
