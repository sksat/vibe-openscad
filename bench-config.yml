  - id: bare/gemini-2.5-flash-lite
    harness: { kind: bare }
    provider: google
    model: gemini-2.5-flash-lite

  # --- OpenAI ---
  # `pnpm --filter runners run list-openai-models` で確認した、API key で
  # 実際に見えるモデル。ただし "*-pro" 系は組織認証(verified org)が必要で
  # 一般 tier だと 404 になるので、認証完了したらコメント解除してください。
  # 429 "exceeded quota" が出る場合は billing/支払い方法側の問題。
  # - id: bare/gpt-5.2-pro
  #   harness: { kind: bare }
  #   provider: openai
  #   model: gpt-5.2-pro-2025-12-11
  # - id: bare/gpt-5-pro
  #   harness: { kind: bare }
  #   provider: openai
  #   model: gpt-5-pro-2025-10-06
  - id: bare/gpt-5.4
    harness: { kind: bare }
    provider: openai
    model: gpt-5.4-2026-03-05
  # Effort variants of gpt-5.4 — default は medium。
  - id: bare-low/gpt-5.4
    harness: { kind: bare }
    provider: openai
    model: gpt-5.4-2026-03-05
    modelOptions: { reasoning: { effort: low } }
  - id: bare-high/gpt-5.4
    harness: { kind: bare }
    provider: openai
    model: gpt-5.4-2026-03-05
    modelOptions: { reasoning: { effort: high } }
